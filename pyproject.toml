[project]
name = "llm-zero-shot-modeling"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12.11"
dependencies = [
    "anthropic>=0.54.0",
    "botorch>=0.14.0",
    "google-genai>=1.31.0",
    "levenshtein>=0.27.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.5",
    "numpy>=2.3.0",
    "openai>=1.86.0",
    "optuna>=4.6.0",
    "pandas>=2.3.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.0",
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "statsmodels>=0.14.5",
    "torch>=2.7.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128"}
torchvision = { index = "pytorch-cu128"}
torchaudio = { index = "pytorch-cu128"}

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
